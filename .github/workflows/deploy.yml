name: Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  PAGES_PROJECT: cozy-d-714
  PRODUCTION_BACKEND_WORKER: cozy-d-714-backend
  WORKERS_SUBDOMAIN: rhainne-work
  NEON_AUTH_URL: https://ep-winter-leaf-a77rysk7.neonauth.ap-southeast-2.aws.neon.tech/neondb/auth

jobs:
  deploy:
    if: |
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Resolve deployment names
        id: names
        shell: bash
        run: |
          raw_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          slug="$(printf '%s' "$raw_branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-32 \
            | sed -E 's/-+$//')"

          if [ -z "$slug" ]; then
            slug="$(git rev-parse --short HEAD)"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            environment="production"
            pages_branch="main"
            backend_worker="${PRODUCTION_BACKEND_WORKER}"
            backend_url="https://${PRODUCTION_BACKEND_WORKER}.${WORKERS_SUBDOMAIN}.workers.dev"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "dev" ]; then
            environment="preview"
            pages_branch="dev"
            backend_worker="${PRODUCTION_BACKEND_WORKER}-dev"
            backend_url="https://${backend_worker}.${WORKERS_SUBDOMAIN}.workers.dev"
          else
            environment="preview"
            pages_branch="$slug"
            backend_worker="${PRODUCTION_BACKEND_WORKER}-${slug}"
            backend_url="https://${backend_worker}.${WORKERS_SUBDOMAIN}.workers.dev"
          fi

          {
            echo "raw_branch=$raw_branch"
            echo "slug=$slug"
            echo "environment=$environment"
            echo "pages_branch=$pages_branch"
            echo "backend_worker=$backend_worker"
            echo "backend_url=$backend_url"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Prepare preview backend secrets
        if: steps.names.outputs.environment == 'preview'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/preview-secrets.env" <<'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          GMAIL_SMTP_USER=${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD=${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          EOF

      - name: Deploy production backend Worker
        if: steps.names.outputs.environment == 'production'
        run: bun --cwd backend wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy preview backend Worker
        if: steps.names.outputs.environment == 'preview'
        run: |
          bun --cwd backend wrangler deploy \
            --name "${{ steps.names.outputs.backend_worker }}" \
            --secrets-file "$RUNNER_TEMP/preview-secrets.env" \
            --var PUBLIC_APP_ORIGIN:"https://${{ steps.names.outputs.pages_branch }}.${{ env.PAGES_PROJECT }}.pages.dev" \
            --var CLOUDFLARE_WORKER_NAME:"${{ steps.names.outputs.backend_worker }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build frontend
        run: bun --cwd frontend build
        env:
          VITE_API_BASE: ${{ steps.names.outputs.backend_url }}
          VITE_NEON_AUTH_URL: ${{ env.NEON_AUTH_URL }}

      - name: Deploy frontend Pages
        run: bunx wrangler pages deploy frontend/dist --project-name "${{ env.PAGES_PROJECT }}" --branch "${{ steps.names.outputs.pages_branch }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Resolve frontend preview URL
        id: pages
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_BRANCH: ${{ steps.names.outputs.pages_branch }}
        run: |
          response="$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?per_page=20")"

          url="$(printf '%s' "$response" | bun -e '
            const data = await new Response(Bun.stdin.stream()).json();
            const branch = process.env.PAGES_BRANCH;
            const deployment = data.result?.find((item) => item.deployment_trigger?.metadata?.branch === branch);
            if (!deployment) process.exit(1);
            console.log(deployment.aliases?.[0] || deployment.url);
          ')"

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR preview URLs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- cozy-d-714-preview -->";
            const body = `${marker}
            **cozy-d-714 preview is ready**

            Frontend: ${{ steps.pages.outputs.url }}
            Backend: ${{ steps.names.outputs.backend_url }}

            Branch: \`${{ steps.names.outputs.raw_branch }}\`
            Worker: \`${{ steps.names.outputs.backend_worker }}\`
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.user.type === "Bot" && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Resolve preview names
        id: names
        shell: bash
        run: |
          raw_branch="${GITHUB_HEAD_REF}"
          slug="$(printf '%s' "$raw_branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-32 \
            | sed -E 's/-+$//')"

          if [ -z "$slug" ]; then
            slug="${{ github.event.pull_request.head.sha }}"
            slug="${slug:0:7}"
          fi

          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "backend_worker=${PRODUCTION_BACKEND_WORKER}-${slug}" >> "$GITHUB_OUTPUT"

      - name: Skip persistent dev preview
        if: steps.names.outputs.slug == 'dev'
        run: echo "Dev preview is persistent; nothing to clean up."

      - name: Delete preview backend Worker
        if: steps.names.outputs.slug != 'dev'
        run: bunx wrangler delete "${{ steps.names.outputs.backend_worker }}" --force || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Delete preview Pages deployments
        if: steps.names.outputs.slug != 'dev'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_BRANCH: ${{ steps.names.outputs.slug }}
        run: |
          response="$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments?per_page=50")"

          printf '%s' "$response" | bun -e '
            const data = await new Response(Bun.stdin.stream()).json();
            const branch = process.env.PAGES_BRANCH;
            const ids = (data.result || [])
              .filter((item) => item.environment === "preview" && item.deployment_trigger?.metadata?.branch === branch)
              .map((item) => item.id);
            console.log(ids.join("\n"));
          ' | while read -r deployment_id; do
            if [ -n "$deployment_id" ]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}/deployments/${deployment_id}" >/dev/null
              echo "Deleted Pages deployment ${deployment_id}"
            fi
          done
