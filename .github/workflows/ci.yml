name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

  # Deploys main to AWS. Needs the repository variable AWS_DEPLOY_ROLE_ARN (an IAM role that trusts this repository
  # through GitHub's OIDC provider) and the CDK context variables below; skipped until they are configured.
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy infrastructure
        run: >
          npm run deploy --workspace infra --
          --require-approval never
          -c dbHost=${{ vars.DB_HOST }}
          -c dbClusterResourceId=${{ vars.DB_CLUSTER_RESOURCE_ID }}
          -c appOrigin=${{ vars.APP_ORIGIN }}

      - name: Run database migrations
        run: |
          FUNCTION="$(aws cloudformation describe-stacks --stack-name CozyD714 \
            --query "Stacks[0].Outputs[?OutputKey=='MigrateFunction'].OutputValue" --output text)"
          aws lambda invoke --function-name "$FUNCTION" --cli-read-timeout 600 /tmp/migrate.json
          cat /tmp/migrate.json

      - name: Publish frontend
        run: infra/scripts/deploy-frontend.sh
